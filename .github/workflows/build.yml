name: Build binaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      WEATHERNEXT_OAUTH_CLIENT_ID: ${{ secrets.WEATHERNEXT_OAUTH_CLIENT_ID || vars.WEATHERNEXT_OAUTH_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ''
          - goos: linux
            goarch: arm64
            extension: ''
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check OAuth client credentials
        env:
          WEATHERNEXT_OAUTH_CLIENT_SECRET: ${{ secrets.WEATHERNEXT_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ -z "$WEATHERNEXT_OAUTH_CLIENT_ID" ]]; then
            echo '::error::Set the WEATHERNEXT_OAUTH_CLIENT_ID Actions secret or variable before publishing release binaries.'
            exit 1
          fi
          if [[ -z "$WEATHERNEXT_OAUTH_CLIENT_SECRET" ]]; then
            echo '::error::Set the WEATHERNEXT_OAUTH_CLIENT_SECRET Actions secret before publishing release binaries.'
            exit 1
          fi

      - name: Cross-compile binary
        env:
          WEATHERNEXT_OAUTH_CLIENT_SECRET: ${{ secrets.WEATHERNEXT_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          mkdir -p dist
          output="dist/weathernext-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
          obfuscated_secret=$(go run ./scripts/obfuscate-secret.go)
          secret_cipher=${obfuscated_secret%%:*}
          secret_key=${obfuscated_secret#*:}
          unset obfuscated_secret WEATHERNEXT_OAUTH_CLIENT_SECRET
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X weathernext/internal/backend.OAuthClientID=${WEATHERNEXT_OAUTH_CLIENT_ID} -X weathernext/internal/backend.OAuthClientSecretCipher=${secret_cipher} -X weathernext/internal/backend.OAuthClientSecretKey=${secret_key}" -o "$output" ./cmd/weathernext

      - name: Upload downloadable binary artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/weathernext-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          archive: false
          if-no-files-found: error
          retention-days: 30
